<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 44" style="background: transparent;">
  <style>
    /* Default Light Mode Styles */
    .prompt { fill: #0284c7; }
    .cmd { fill: #0f172a; font-weight: 700; }
    .flag { fill: #64748b; }
    .comment { fill: #94a3b8; font-style: italic; }
    .cursor { fill: #0284c7; }

    /* Dark Mode (Tokyonight Theme) Styles */
    @media (prefers-color-scheme: dark) {
      .prompt { fill: #00f2fe; }
      .cmd { fill: #cbd5e1; }
      .flag { fill: #8b949e; }
      .comment { fill: #565f89; }
      .cursor { fill: #00f2fe; }
    }
  </style>

  <g font-family="'Courier New', Courier, monospace" font-size="17" letter-spacing="1">
    <text x="400" y="28" text-anchor="middle"><tspan class="prompt">~$ </tspan><tspan class="cmd">ls ~/builds</tspan><tspan class="flag"> --sort recent</tspan><tspan class="comment">   # 2 shipped this week</tspan><tspan class="cursor"> _<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" /></tspan></text>
  </g>
</svg>
