<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 380" style="background: transparent;">
  <style>
    /* Default Light Mode Styles */
    .card-border { stroke: #c7d0da; }
    .prompt-text { fill: #64748b; }
    .meta-text { fill: #64748b; }
    .wire { stroke: #475569; }
    .sym { stroke: #0284c7; }
    .sym-fill { fill: #0284c7; }
    .term { stroke: #475569; }
    .lbl { fill: #64748b; }
    .vdd-label { fill: #334155; }
    .flow { stroke: #15803d; }
    .i-arrow { fill: #15803d; }
    .divider { stroke: #e2e8f0; }
    .eq-muted { fill: #64748b; }
    .f-hardwork { fill: #d97706; }
    .f-excuses { fill: #dc2626; }
    .f-success { fill: #15803d; }
    .quote-text { fill: #0f766e; font-style: italic; font-weight: 600; }

    /* Dark Mode (Tokyonight Theme) Styles */
    @media (prefers-color-scheme: dark) {
      .card-border { stroke: #2f3f55; }
      .prompt-text { fill: #98a4b3; }
      .meta-text { fill: #98a4b3; }
      .wire { stroke: #9aa7b8; }
      .sym { stroke: #7dcfff; }
      .sym-fill { fill: #7dcfff; }
      .term { stroke: #9aa7b8; }
      .lbl { fill: #98a4b3; }
      .vdd-label { fill: #d5dce3; }
      .flow { stroke: #9ece6a; }
      .i-arrow { fill: #9ece6a; }
      .divider { stroke: #263450; }
      .eq-muted { fill: #9aa7b8; }
      .f-hardwork { fill: #ff9e64; }
      .f-excuses { fill: #f7768e; }
      .f-success { fill: #9ece6a; }
      .quote-text { fill: #73daca; }
    }
  </style>

  <!-- Card frame -->
  <rect x="2" y="2" width="826" height="376" rx="14" fill="none" class="card-border" stroke-width="1.5" />

  <!-- Header -->
  <circle cx="30" cy="34" r="4.5" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <g font-family="'Courier New', Courier, monospace">
    <text x="48" y="39" font-size="15" letter-spacing="0.5" class="prompt-text">~$ cat success.circuit</text>
    <text x="802" y="39" font-size="13" text-anchor="end" letter-spacing="0.5" class="meta-text">[ N-channel · enhancement mode ]</text>
  </g>

  <!-- ============ SCHEMATIC (left half) ============ -->

  <!-- VDD terminal -->
  <text x="300" y="66" text-anchor="middle" font-family="'Courier New', Courier, monospace"
        font-size="15" font-weight="700" class="vdd-label">VDD</text>
  <circle cx="300" cy="80" r="4.5" fill="none" class="term" stroke-width="2" />

  <!-- Wires: VDD → resistor → drain -->
  <g fill="none" class="wire" stroke-width="2" stroke-linecap="round">
    <path d="M 300 84.5 V 106" />
    <path d="M 300 166 V 226 H 278" />
    <!-- gate lead -->
    <path d="M 179.5 252 H 266" />
    <!-- body tap and join down to source -->
    <path d="M 281 252 H 300 V 278" />
    <!-- source lead and rail to ground -->
    <path d="M 278 278 H 300 V 318" />
  </g>

  <!-- Resistor (zigzag) -->
  <path d="M 300 106 l 0 4 l 12 5 l -24 10 l 24 10 l -24 10 l 24 10 l -12 5 l 0 6"
        fill="none" class="wire" stroke-width="2.5" stroke-linejoin="round" />
  <text x="326" y="140" font-family="'Courier New', Courier, monospace" font-size="13.5" class="lbl">R_load</text>

  <!-- Gate terminal -->
  <circle cx="175" cy="252" r="4.5" fill="none" class="term" stroke-width="2" />

  <!-- MOSFET symbol: gate plate + segmented channel (enhancement mode) -->
  <g fill="none" class="sym" stroke-linecap="round">
    <path d="M 266 220 V 284" stroke-width="3" />
    <path d="M 276 216 V 236" stroke-width="5" />
    <path d="M 276 242 V 262" stroke-width="5" />
    <path d="M 276 268 V 288" stroke-width="5" />
  </g>
  <!-- Body arrow (points into channel — N-channel) -->
  <polygon points="281,252 292,247 292,257" class="sym-fill" />

  <!-- Ground symbol -->
  <g fill="none" class="wire" stroke-linecap="round">
    <path d="M 278 318 H 322" stroke-width="3" />
    <path d="M 286 326 H 314" stroke-width="2.5" />
    <path d="M 294 334 H 306" stroke-width="2" />
  </g>

  <!-- Animated drain current (VDD → drain → source → GND) -->
  <path d="M 300 84 V 104 M 300 168 V 224 M 300 280 V 316"
        fill="none" class="flow" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="7 11">
    <animate attributeName="stroke-dashoffset" from="18" to="0" dur="0.9s" repeatCount="indefinite" />
  </path>

  <!-- I_success arrow beside the drain rail -->
  <line x1="312" y1="176" x2="312" y2="200" class="flow" stroke-width="2" stroke-linecap="round" />
  <polygon points="312,208 307,199 317,199" class="i-arrow" />
  <text x="324" y="196" font-family="'Courier New', Courier, monospace" class="f-success"><tspan font-size="17" font-style="italic">I</tspan><tspan font-size="12" dy="3">success</tspan></text>

  <!-- Terminal letters -->
  <g font-family="'Courier New', Courier, monospace" font-size="13" class="lbl">
    <text x="308" y="222">D</text>
    <text x="266" y="210" text-anchor="middle">G</text>
    <text x="308" y="284">S</text>
  </g>

  <!-- Gate labels -->
  <text x="166" y="240" text-anchor="end" font-family="'Courier New', Courier, monospace" class="f-hardwork"><tspan font-size="18" font-style="italic">V</tspan><tspan font-size="13" dy="3">hardwork</tspan></text>
  <text x="166" y="274" text-anchor="end" font-family="'Courier New', Courier, monospace" class="f-excuses"><tspan font-size="14" font-style="italic">V</tspan><tspan font-size="10" dy="2">th</tspan><tspan font-size="14" dy="-2"> = V</tspan><tspan font-size="10" dy="2">excuses</tspan></text>

  <!-- ============ EQUATION PANEL (right half) ============ -->

  <line x1="470" y1="120" x2="470" y2="300" class="divider" stroke-width="1" />

  <text x="636" y="136" text-anchor="middle" font-family="'Courier New', Courier, monospace"
        font-size="13" letter-spacing="0.5" class="eq-muted">// conduction condition</text>

  <!-- The equation — big -->
  <text x="636" y="184" text-anchor="middle" font-family="'Courier New', Courier, monospace"><tspan font-size="26" font-style="italic" class="f-hardwork">V</tspan><tspan font-size="16" dy="4" class="f-hardwork">hardwork</tspan><tspan font-size="26" dy="-4" class="eq-muted"> &gt; </tspan><tspan font-size="26" font-style="italic" class="f-excuses">V</tspan><tspan font-size="16" dy="4" class="f-excuses">excuses</tspan></text>

  <text x="636" y="230" text-anchor="middle" font-family="'Courier New', Courier, monospace"><tspan font-size="26" class="eq-muted">→ </tspan><tspan font-size="26" font-style="italic" class="f-success">I</tspan><tspan font-size="16" dy="4" class="f-success">success</tspan><tspan font-size="26" dy="-4" class="f-success"> flows</tspan></text>

  <!-- Status line -->
  <text x="636" y="272" text-anchor="middle" font-family="'Courier New', Courier, monospace"
        font-size="15" font-weight="700" letter-spacing="1" class="f-success">[ mosfet: ON — conducting ]<animate attributeName="opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite" /></text>

  <text x="636" y="296" text-anchor="middle" font-family="'Courier New', Courier, monospace"
        font-size="13" class="eq-muted">// hard work wins — current flows</text>

  <!-- Caption -->
  <text x="415" y="358" text-anchor="middle" font-size="15" class="quote-text"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">When hard work exceeds your excuses, success flows.</text>
</svg>
