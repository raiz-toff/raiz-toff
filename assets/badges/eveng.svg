<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 36" width="140" height="36">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#05070f" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="139" height="35" rx="8" fill="url(#bg)" stroke="url(#border)" stroke-width="1" />
  
  <!-- Icon: EVE-NG Topology -->
  <g transform="translate(18, 18)" filter="url(#glow)">
    <circle cx="-5" cy="4" r="3.5" fill="none" stroke="#a78bfa" stroke-width="1.5" />
    <circle cx="5" cy="4" r="3.5" fill="none" stroke="#a78bfa" stroke-width="1.5" />
    <circle cx="0" cy="-4" r="3.5" fill="none" stroke="#a78bfa" stroke-width="1.5" />
    <line x1="-2.5" y1="1.5" x2="-1.5" y2="-1.5" stroke="#a78bfa" stroke-width="1" />
    <line x1="2.5" y1="1.5" x2="1.5" y2="-1.5" stroke="#a78bfa" stroke-width="1" />
    <line x1="-1.5" y1="4" x2="1.5" y2="4" stroke="#a78bfa" stroke-width="1" />
  </g>
  
  <!-- Text -->
  <text x="38" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f1f5f9">EVE-NG</text>
  <circle cx="125" cy="18" r="3" fill="#a78bfa" filter="url(#glow)" />
</svg>
