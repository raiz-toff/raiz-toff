<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 36" width="140" height="36">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#05070f" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="139" height="35" rx="8" fill="url(#bg)" stroke="url(#border)" stroke-width="1" />
  
  <!-- Icon: Gear / Automation Cog -->
  <g transform="translate(18, 18)" filter="url(#glow)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#10b981" stroke-width="1.8" />
    <path d="M 0 -7 L 0 -5 M 0 5 L 0 7 M -7 0 L -5 0 M 5 0 L 7 0 M -4.5 -4.5 L -3 -3 M 3 3 L 4.5 4.5 M -4.5 4.5 L -3 3 M 3 -3 L 4.5 -4.5" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
  </g>
  
  <!-- Text -->
  <text x="38" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Automation</text>
  <circle cx="125" cy="18" r="3" fill="#10b981" filter="url(#glow)" />
</svg>
