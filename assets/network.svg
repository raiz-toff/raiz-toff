<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 148" style="background: transparent;">
  <style>
    /* Default Light Mode Styles */
    .pipe { stroke: #dde3ea; }
    .spark { stroke: #0284c7; }
    .node { fill: #0284c7; }
    .console-text { fill: #64748b; }
    .cloud { stroke: #0284c7; }
    .cursor { fill: #0284c7; }
    .p1 { fill: #1d4ed8; } .p2 { fill: #2563eb; } .p3 { fill: #0284c7; }
    .p4 { fill: #0ea5e9; } .p5 { fill: #0891b2; } .p6 { fill: #06b6d4; }

    /* Dark Mode (Tokyonight Theme) Styles */
    @media (prefers-color-scheme: dark) {
      .pipe { stroke: #2b3950; }
      .spark { stroke: #00f2fe; }
      .node { fill: #00f2fe; }
      .console-text { fill: #98a4b3; }
      .cloud { stroke: #00f2fe; }
      .cursor { fill: #00f2fe; }
      .p1 { fill: #388bfd; } .p2 { fill: #44a5ff; } .p3 { fill: #58a6ff; }
      .p4 { fill: #79b8ff; } .p5 { fill: #96d0ff; } .p6 { fill: #00f2fe; }
    }

    @keyframes dance {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      25% { transform: translate(0px, -3px) rotate(3deg); }
      50% { transform: translate(0px, 0px) rotate(0deg); }
      75% { transform: translate(0px, -3px) rotate(-3deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }
    .dancing-cloud {
      animation: dance 4s ease-in-out infinite;
      transform-origin: 10px 10px;
    }
  </style>

  <!-- BACKGROUND: Base Conduits -->
  <g fill="none" class="pipe" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pipe 1 (Top Wave) -->
    <path d="M -40 30 L 125 30 L 249 46 L 415 30 L 581 46 L 705 30 L 870 30" stroke-width="10">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="3.5s" repeatCount="indefinite" />
    </path>

    <!-- Pipe 2 (Middle Wave) -->
    <path d="M -40 62 L 125 62 L 249 46 L 415 62 L 581 78 L 705 62 L 870 62" stroke-width="20">
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="4s" repeatCount="indefinite" />
    </path>

    <!-- Pipe 3 (Bottom Wave) -->
    <path d="M -40 94 L 125 94 L 249 78 L 415 94 L 581 78 L 705 94 L 870 94" stroke-width="13">
      <animate attributeName="opacity" values="0.6; 1; 0.6" dur="4.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- FOREGROUND: Moving Packet Sparks -->
  <g fill="none" class="spark" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spark on Pipe 1 -->
    <path d="M -40 30 L 125 30 L 249 46 L 415 30 L 581 46 L 705 30 L 870 30"
          stroke-width="3.5" stroke-dasharray="10 140">
      <animate attributeName="stroke-dashoffset" from="300" to="0" dur="1.2s" repeatCount="indefinite" />
    </path>

    <!-- Spark on Pipe 2 -->
    <path d="M -40 62 L 125 62 L 249 46 L 415 62 L 581 78 L 705 62 L 870 62"
          stroke-width="4.5" stroke-dasharray="14 196">
      <animate attributeName="stroke-dashoffset" from="420" to="0" dur="1.5s" repeatCount="indefinite" />
    </path>

    <!-- Spark on Pipe 3 -->
    <path d="M -40 94 L 125 94 L 249 78 L 415 94 L 581 78 L 705 94 L 870 94"
          stroke-width="3.5" stroke-dasharray="12 156">
      <animate attributeName="stroke-dashoffset" from="336" to="0" dur="1.8s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- JUNCTION NODES -->
  <g class="node">
    <circle cx="249" cy="46" r="4.5" />
    <circle cx="581" cy="78" r="4.5" />
  </g>

  <!-- CONSOLE TEXT (single centered line — no overlap between segments) -->
  <text x="415" y="134" font-family="'Courier New', Courier, monospace" font-size="18" text-anchor="middle" letter-spacing="0.8"><tspan class="console-text">&gt; Let's get that </tspan><tspan class="p1">p</tspan><tspan class="p2">a</tspan><tspan class="p3">c</tspan><tspan class="p4">k</tspan><tspan class="p5">e</tspan><tspan class="p6">t</tspan><tspan class="console-text"> moving</tspan><tspan class="cursor"> _<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" /></tspan></text>

  <!-- DANCING CLOUD ICON -->
  <g transform="translate(618, 116)">
    <g class="dancing-cloud">
      <path d="M11.0947 8.02658C11.5476 5.73111 13.5717 4 16 4C18.7614 4 21 6.23858 21 9C21 11.0345 19.7849 12.7852 18.0408 13.5659M11.0947 8.02658C9.24194 8.21766 7.68947 9.4193 7 11C4.6 11.375 3 13.3144 3 15.4137C3 17.9466 5.14903 20 7.8 20L15 20C17.2091 20 19 18.2719 19 16.1402C19 15.1829 18.6388 14.2698 18.0408 13.5659M11.0947 8.02658C11.265 8.00902 11.4378 8 11.6127 8C14.2747 8 16.4504 9.99072 16.6 12.5C17.1583 12.7354 17.6501 13.106 18.0408 13.5659"
            fill="none" class="cloud" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.85)" />
    </g>
  </g>
</svg>
