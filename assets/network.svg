<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" style="background: transparent;">
  <style>
    @keyframes dance {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      25% { transform: translate(0px, -3px) rotate(3deg); }
      50% { transform: translate(0px, 0px) rotate(0deg); }
      75% { transform: translate(0px, -3px) rotate(-3deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }
    .dancing-cloud {
      animation: dance 4s ease-in-out infinite;
      transform-origin: 10px 10px;
    }
  </style>

  <!-- BACKGROUND: Base Conduits (Flat Slate Blue) -->
  <g fill="none" stroke="#26354a" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pipe 1 (Top Wave) -->
    <path d="M -50 35 L 150 35 L 300 55 L 500 35 L 700 55 L 850 35 L 1050 35" stroke-width="12">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="3.5s" repeatCount="indefinite" />
    </path>

    <!-- Pipe 2 (Middle Wave) -->
    <path d="M -50 75 L 150 75 L 300 55 L 500 75 L 700 95 L 850 75 L 1050 75" stroke-width="24">
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="4s" repeatCount="indefinite" />
    </path>

    <!-- Pipe 3 (Bottom Wave) -->
    <path d="M -50 115 L 150 115 L 300 95 L 500 115 L 700 95 L 850 115 L 1050 115" stroke-width="16">
      <animate attributeName="opacity" values="0.6; 1; 0.6" dur="4.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- FOREGROUND: Moving Lightning Sparks (Flat Electric Cyan, No Glow) -->
  <g fill="none" stroke="#00f2fe" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lightning on Pipe 1 -->
    <path d="M -50 35 L 150 35 L 300 55 L 500 35 L 700 55 L 850 35 L 1050 35" 
          stroke-width="3.5" stroke-dasharray="10 140">
      <animate attributeName="stroke-dashoffset" from="300" to="0" dur="1.2s" repeatCount="indefinite" />
    </path>

    <!-- Lightning on Pipe 2 -->
    <path d="M -50 75 L 150 75 L 300 55 L 500 75 L 700 95 L 850 75 L 1050 75" 
          stroke-width="4.5" stroke-dasharray="15 210">
      <animate attributeName="stroke-dashoffset" from="450" to="0" dur="1.5s" repeatCount="indefinite" />
    </path>

    <!-- Lightning on Pipe 3 -->
    <path d="M -50 115 L 150 115 L 300 95 L 500 115 L 700 95 L 850 115 L 1050 115" 
          stroke-width="3.5" stroke-dasharray="12 168">
      <animate attributeName="stroke-dashoffset" from="360" to="0" dur="1.8s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- ELECTRICAL JUNCTION NODES (Flat Electric Cyan) -->
  <g fill="#00f2fe">
    <circle cx="300" cy="55" r="5" />
    <circle cx="700" cy="95" r="5" />
  </g>

  <!-- CREATIVE CONSOLE TEXT -->
  <!-- Left static text -->
  <text x="450" y="152" font-family="'Courier New', Courier, monospace" font-size="18" fill="#8b949e" text-anchor="end" letter-spacing="1.2">
    &gt; Let's get that
  </text>

  <!-- Center word 'packet' with tech-blue gradient letters -->
  <text x="500" y="152" font-family="'Courier New', Courier, monospace" font-size="18" text-anchor="middle" letter-spacing="1.2">
    <tspan fill="#388bfd">p</tspan><tspan fill="#44a5ff">a</tspan><tspan fill="#58a6ff">c</tspan><tspan fill="#79b8ff">k</tspan><tspan fill="#96d0ff">e</tspan><tspan fill="#00f2fe">t</tspan>
  </text>

  <!-- Right static text -->
  <text x="550" y="152" font-family="'Courier New', Courier, monospace" font-size="18" fill="#8b949e" text-anchor="start" letter-spacing="1.2">
    moving
  </text>

  <!-- DANCING CLOUD ICON -->
  <g transform="translate(634, 134)">
    <g class="dancing-cloud">
      <path d="M11.0947 8.02658C11.5476 5.73111 13.5717 4 16 4C18.7614 4 21 6.23858 21 9C21 11.0345 19.7849 12.7852 18.0408 13.5659M11.0947 8.02658C9.24194 8.21766 7.68947 9.4193 7 11C4.6 11.375 3 13.3144 3 15.4137C3 17.9466 5.14903 20 7.8 20L15 20C17.2091 20 19 18.2719 19 16.1402C19 15.1829 18.6388 14.2698 18.0408 13.5659M11.0947 8.02658C11.265 8.00902 11.4378 8 11.6127 8C14.2747 8 16.4504 9.99072 16.6 12.5C17.1583 12.7354 17.6501 13.106 18.0408 13.5659" 
            fill="none" stroke="#00f2fe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.83)" />
    </g>
  </g>

  <!-- BLINKING TERMINAL CURSOR -->
  <text x="660" y="152" font-family="'Courier New', Courier, monospace" font-size="18" fill="#00f2fe" text-anchor="start">
    _<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </text>
</svg>
