<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 406 172" style="background: transparent;">
  <style>
    /* Default Light Mode Styles */
    .card-border { stroke: #c7d0da; }
    .packet { stroke: #0284c7; }
    .title-text { fill: #0f172a; }
    .meta-text { fill: #64748b; }
    .body-text { fill: #334155; font-weight: 500; }
    .chip-text { fill: #0284c7; font-weight: 700; }
    .chip-dot { fill: #94a3b8; }

    /* Dark Mode (Tokyonight Theme) Styles */
    @media (prefers-color-scheme: dark) {
      .card-border { stroke: #2f3f55; }
      .packet { stroke: #00f2fe; }
      .title-text { fill: #f8fafc; }
      .meta-text { fill: #98a4b3; }
      .body-text { fill: #ccd5de; }
      .chip-text { fill: #7dcfff; }
      .chip-dot { fill: #6e7f96; }
    }
  </style>

  <!-- Card frame -->
  <rect x="2" y="2" width="402" height="168" rx="12" fill="none" class="card-border" stroke-width="1.5" />

  <!-- Packet orbiting the card -->
  <rect x="2" y="2" width="402" height="168" rx="12" fill="none" class="packet" stroke-width="2.5"
        stroke-linecap="round" stroke-dasharray="22 1097.4">
    <animate attributeName="stroke-dashoffset" from="1119.4" to="0" dur="7s" repeatCount="indefinite" />
  </rect>

  <!-- Status LED -->
  <circle cx="26" cy="29" r="4" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite" />
  </circle>

  <!-- Header -->
  <g font-family="'Courier New', Courier, monospace">
    <text x="40" y="35" font-size="17" font-weight="700" class="title-text">comma</text>
    <text x="384" y="34" font-size="12.5" text-anchor="end" class="meta-text">v1.2.0 · APK + PWA</text>
  </g>

  <!-- Description -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" letter-spacing="0.1">
    <text x="26" y="66" class="body-text">Earnings tracker for gig workers — shifts, GPS</text>
    <text x="26" y="85" class="body-text">mileage, expenses, and real tax estimates.</text>
    <text x="26" y="104" class="body-text">Local-first: everything stays on your phone.</text>
    <text x="26" y="123" class="body-text">No account, no cloud.</text>
  </g>

  <!-- Stack chips -->
  <text x="26" y="150" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="0.3"
        class="chip-text">React Native<tspan class="chip-dot"> · </tspan>Expo<tspan class="chip-dot"> · </tspan>TypeScript<tspan class="chip-dot"> · </tspan>SQLite</text>
</svg>
